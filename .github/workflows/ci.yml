name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore CloudObservabilityDemo.sln
      - run: dotnet build CloudObservabilityDemo.sln --configuration Release --no-restore
      - run: dotnet test CloudObservabilityDemo.sln --configuration Release --no-build --verbosity normal
